name: Build & deploy menus

# Manual rebuild, a nightly scheduled build, and on push to main.
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"   # 08:00 UTC nightly

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: pip install -r requirements.txt

      - name: Install Chromium (for PDF export)
        uses: browser-actions/setup-chrome@v1

      - name: Build (fetch Airtable, render, PDFs, acceptance)
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
        run: |
          python -m src.build --fetch --diff
          python -m tests.acceptance

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
